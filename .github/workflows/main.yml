name: Scheduled Bulk Instagram to Buffer (Algeria Time)

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process_reels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install instaloader requests

      - name: Process up to 10 Reels Sequentially From File
        id: process_step
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import sys
          import instaloader
          import shutil
          import requests
          import urllib.parse
          import time
          import glob

          TXT_FILE = "reels.txt"
          BUFFER_TOKEN = "MnPkbBRZulID113ZBbcU1FaOSRRKckgvUJAKT3uqMfg"
          BUFFER_CHANNEL_ID = "6a11e7f5090476fb99512e90"
          GITHUB_REPOSITORY = os.getenv('GITHUB_REPOSITORY')

          if not os.path.exists(TXT_FILE) or os.stat(TXT_FILE).st_size == 0:
              sys.exit(0)

          with open(TXT_FILE, "r", encoding="utf-8") as f:
              all_links = [line.strip() for line in f.readlines() if line.strip()]

          if not all_links:
              sys.exit(0)

          total_to_process = min(10, len(all_links))
          L = instaloader.Instaloader(
              download_pictures=False, download_videos=True, 
              download_video_thumbnails=False, download_comments=False, 
              save_metadata=False, dirname_pattern="./videos"
          )

          successful_count = 0

          for i in range(total_to_process):
              with open(TXT_FILE, "r", encoding="utf-8") as f:
                  current_lines = [line.strip() for line in f.readlines() if line.strip()]
              
              if not current_lines:
                  break
                  
              url = current_lines[0]
              
              if i > 0:
                  time.sleep(20)
              
              try:
                  shortcode = url.split("/reel/")[1].split("/")[0] if "/reel/" in url else url.split("/p/")[1].split("/")[0]
                  
                  os.system('git config --global user.name "github-actions[bot]"')
                  os.system('git config --global user.email "github-actions[bot]@users.noreply.github.com"')
                  
                  if os.path.exists("./videos"): 
                      shutil.rmtree("./videos")
                  os.makedirs("./videos", exist_ok=True)
                  
                  os.system('git rm -f videos/*.mp4 >/dev/null 2>&1 || true')
                  os.system('git commit -m "Clean previous video cache [skip ci]" || true')
                  os.system('git push || true')
                  
                  post = instaloader.Post.from_shortcode(L.context, shortcode)
                  if not post.is_video:
                      raise Exception("Not a video")

                  L.download_post(post, target="./videos")
                  
                  video_files = glob.glob("./videos/*.mp4")
                  if not video_files:
                      raise Exception("Download failed")
                      
                  target_video = video_files[0]
                  actual_filename = os.path.basename(target_video)

                  caption = post.caption if post.caption else "Video"
                  clean_caption = caption.replace('"', '\\"').replace('\n', ' ')

                  encoded_filename = urllib.parse.quote(actual_filename)
                  public_url = f"https://raw.githubusercontent.com/{GITHUB_REPOSITORY}/main/videos/{encoded_filename}"
                  
                  os.system(f'git add "{target_video}"')
                  os.system(f'git commit -m "Upload new video: {shortcode} [skip ci]" || true')
                  os.system('git push')

                  time.sleep(15)

                  query = f'mutation CreatePost {{ createPost(input: {{ text: "{clean_caption}", channelId: "{BUFFER_CHANNEL_ID}", schedulingType: automatic, mode: addToQueue, assets: {{ video: {{ url: "{public_url}" }} }} }}) {{ ... on PostActionSuccess {{ post {{ id }} }} ... on MutationError {{ message }} }} }}'
                  
                  buf_resp = requests.post(
                      "https://api.buffer.com/v1/graphql",
                      json={"query": query},
                      headers={"Authorization": f"Bearer {BUFFER_TOKEN}", "Content-Type": "application/json"}
                  )
                  
                  buf_data = buf_resp.json()
                  if buf_resp.status_code == 200 and "data" in buf_data:
                      create_post_data = buf_data["data"]["createPost"]
                      if create_post_data and "post" in create_post_data and create_post_data["post"]:
                          successful_count += 1
                          
                          remaining_lines = current_lines[1:]
                          with open(TXT_FILE, "w", encoding="utf-8") as f:
                              for line in remaining_lines:
                                  f.write(line + "\n")
                                  
                          os.system(f'git add {TXT_FILE}')
                          os.system('git rm -f videos/*.mp4 >/dev/null 2>&1 || true')
                          os.system(f'git commit -m "Remove processed link: {shortcode} [skip ci]" || true')
                          os.system('git push')
                      else:
                          raise Exception("Buffer error")
                  else:
                      raise Exception("HTTP Error")

              except Exception as e:
                  sys.exit(1)

          PYTHON_SCRIPT
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Final Clean
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f videos/*.mp4 || true
          git commit -m "Final workflow cleanup [skip ci]" || true
          git push
