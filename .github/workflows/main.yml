name: Instagram to Buffer (Auto Clean Repository)

on:
  workflow_dispatch:
    inputs:
      instagram_url:
        description: 'رابط انستغرام'
        required: true
        type: string
      chat_id:
        description: 'Chat ID'
        required: true
        type: string
      message_id:
        description: 'Message ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deps
        run: pip install instaloader requests

      - name: Download from Instagram
        id: instagram_download
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import sys
          import instaloader
          import glob
          import shutil

          INSTAGRAM_URL = os.getenv('INSTAGRAM_URL')

          try:
              shortcode = None
              if "/reel/" in INSTAGRAM_URL:
                  shortcode = INSTAGRAM_URL.split("/reel/")[1].split("/")[0]
              elif "/p/" in INSTAGRAM_URL:
                  shortcode = INSTAGRAM_URL.split("/p/")[1].split("/")[0]
              
              if not shortcode:
                  raise Exception("رابط غير صالح")

              print(f"🔍 جاري جلب المقطع الحالي: {shortcode}")

              # تنظيف المجلد المحلي تماماً قبل تحميل المقطع الجديد
              if os.path.exists("./videos"):
                  shutil.rmtree("./videos")
              os.makedirs("./videos", exist_ok=True)

              L = instaloader.Instaloader(download_pictures=False, download_videos=True, download_video_thumbnails=False, download_comments=False, save_metadata=False, dirname_pattern="./videos", filename_pattern="{shortcode}")
              post = instaloader.Post.from_shortcode(L.context, shortcode)
              
              if not post.is_video:
                  raise Exception("المنشور ليس فيديو")

              L.download_post(post, target="./videos")
              
              target_video = f"./videos/{shortcode}.mp4"
              if not os.path.exists(target_video):
                  raise Exception("فشل تحميل المقطع الجديد")
              
              print(f"✅ تم الحفظ بنجاح محلياً: {target_video}")
              
              # جلب الوصف العربي وتنظيفه
              caption = post.caption if post.caption else "فيديو من انستغرام"
              clean_caption = caption.replace('"', '\\"').replace('\n', ' ')
              
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
                  f.write(f"video_caption={clean_caption}\n")
                  f.write(f"video_filename={shortcode}.mp4\n")

          except Exception as e:
              print(f"❌ خطأ: {str(e)}")
              sys.exit(1)
          PYTHON_SCRIPT
        env:
          INSTAGRAM_URL: ${{ github.event.inputs.instagram_url }}

      - name: Sync, Clean, and Push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # مسح الفيديوهات القديمة من تتبع جيت هاب (إن وجدت) لضمان بقاء المستودع نظيفاً
          git rm -f videos/*.mp4 || echo "No old videos to remove from git index"
          
          # إضافة الملف الجديد المحدث فقط
          git add videos/${{ steps.instagram_download.outputs.video_filename }}
          
          git commit -m "Update repository: Keep only ${{ steps.instagram_download.outputs.video_filename }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Send Public Link to Buffer
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import sys
          import requests
          import urllib.parse
          import time

          CHAT_ID = os.getenv('CHAT_ID')
          MSG_ID = os.getenv('MSG_ID')
          VIDEO_CAPTION = os.getenv('VIDEO_CAPTION')
          VIDEO_FILENAME = os.getenv('VIDEO_FILENAME')
          BOT_TOKEN = "8769565075:AAEOC6vXy7XgXJ-G5kn5V5PxPTC4EWlBfo8"
          BUFFER_TOKEN = "MnPkbBRZulID113ZBbcU1FaOSRRKckgvUJAKT3uqMfg"
          BUFFER_CHANNEL_ID = "6a11e7f5090476fb99512e90"
          GITHUB_REPOSITORY = os.getenv('GITHUB_REPOSITORY')

          def send_telegram(text):
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              data = {"chat_id": CHAT_ID, "text": text, "parse_mode": "Markdown", "reply_to_message_id": int(MSG_ID) if MSG_ID != "0" else None}
              if MSG_ID != "0":
                  requests.post(url, json=data)

          try:
              if not VIDEO_FILENAME:
                  raise Exception("اسم الملف الجديد غير متوفر")
              
              encoded_filename = urllib.parse.quote(VIDEO_FILENAME)
              
              # توليد الرابط العلني والنظيف للمقطع الجديد
              public_url = f"https://raw.githubusercontent.com/{GITHUB_REPOSITORY}/main/videos/{encoded_filename}"
              print(f"✅ الرابط المباشر للمقطع الحالي: {public_url}")
              
              print("⏳ جاري الانتظار لمدة 20 ثانية لتحديث الكاش العلني...")
              time.sleep(20)

              print(f"📝 العنوان المستخدم للنشر: {VIDEO_CAPTION}")
              
              print("🚀 جاري النشر على Buffer...")
              query = f'mutation CreatePost {{ createPost(input: {{ text: "{VIDEO_CAPTION}", channelId: "{BUFFER_CHANNEL_ID}", schedulingType: automatic, mode: addToQueue, assets: {{ video: {{ url: "{public_url}" }} }} }}) {{ ... on PostActionSuccess {{ post {{ id text }} }} ... on MutationError {{ message }} }} }}'
              
              buf_resp = requests.post(
                  "https://api.buffer.com/v1/graphql",
                  json={"query": query},
                  headers={
                      "Authorization": f"Bearer {BUFFER_TOKEN}",
                      "Content-Type": "application/json"
                  }
              )
              
              buf_data = buf_resp.json()
              if buf_resp.status_code == 200 and "data" in buf_data:
                  create_post_data = buf_data["data"]["createPost"]
                  if create_post_data and "post" in create_post_data and create_post_data["post"]:
                      post_id = create_post_data["post"]["id"]
                      send_telegram(f"✅ **تم بنجاح!**\n🎥 تم نشر المقطع الجديد واستبدال الملفات القديمة بنجاح.")
                      print("✅ تم النشر بنجاح!")
                  elif create_post_data and "message" in create_post_data:
                      raise Exception(f"خطأ Buffer: {create_post_data['message']}")
                  else:
                      raise Exception(f"فشل مجهول في استجابة Buffer: {buf_data}")
              else:
                  raise Exception(f"HTTP Error: {buf_resp.status_code}\nResponse: {buf_resp.text}")

          except Exception as e:
              err_msg = str(e)
              print(f"❌ خطأ: {err_msg}")
              send_telegram(f"❌ **فشل التنفيذ**\n⚠️ السبب: {err_msg}")
              sys.exit(1)
          PYTHON_SCRIPT
        env:
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          MSG_ID: ${{ github.event.inputs.message_id }}
          VIDEO_CAPTION: ${{ steps.instagram_download.outputs.video_caption }}
          VIDEO_FILENAME: ${{ steps.instagram_download.outputs.video_filename }}
          GITHUB_REPOSITORY: ${{ github.repository }}
