name: Instagram to Telegram

on:
  workflow_dispatch:
    inputs:
      instagram_url:
        description: 'رابط انستغرام'
        required: true
        type: string
      chat_id:
        description: 'Chat ID'
        required: true
        type: string
      message_id:
        description: 'Message ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deps
        run: pip install instaloader requests

      - name: Download from Instagram
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import sys
          import instaloader
          import glob

          INSTAGRAM_URL = os.getenv('INSTAGRAM_URL')

          try:
              shortcode = None
              if "/reel/" in INSTAGRAM_URL:
                  shortcode = INSTAGRAM_URL.split("/reel/")[1].split("/")[0]
              elif "/p/" in INSTAGRAM_URL:
                  shortcode = INSTAGRAM_URL.split("/p/")[1].split("/")[0]
              
              if not shortcode:
                  raise Exception("رابط غير صالح")

              print(f"🔍 جاري جلب: {shortcode}")

              os.makedirs("./videos", exist_ok=True)
              L = instaloader.Instaloader(download_pictures=False, download_videos=True, download_video_thumbnails=False, download_comments=False, save_metadata=False, dirname_pattern="./videos", filename_pattern="{shortcode}")
              post = instaloader.Post.from_shortcode(L.context, shortcode)
              
              if not post.is_video:
                  raise Exception("المنشور ليس فيديو")

              L.download_post(post, target="./videos")
              
              files = [f for f in glob.glob("./videos/*") if f.endswith('.mp4')]
              if not files: raise Exception("فشل التحميل إلى مجلد videos")
              
              print(f"✅ تم الحفظ في المجلد المحلي: {files[0]}")

          except Exception as e:
              print(f"❌ خطأ: {str(e)}")
              sys.exit(1)
          PYTHON_SCRIPT
        env:
          INSTAGRAM_URL: ${{ github.event.inputs.instagram_url }}

      - name: Commit and Push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/*.mp4
          git commit -m "Save video to repository [skip ci]" || echo "No changes to commit"
          git push

      - name: Send Video to Telegram
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import sys
          import glob
          import requests

          CHAT_ID = os.getenv('CHAT_ID')
          MSG_ID = os.getenv('MSG_ID')
          BOT_TOKEN = "8769565075:AAEOC6vXy7XgXJ-G5kn5V5PxPTC4EWlBfo8"

          try:
              files = [f for f in glob.glob("./videos/*") if f.endswith('.mp4')]
              if not files: raise Exception("لم يتم العثور على ملف الفيديو لإرساله")
              
              video_path = files[0]
              print(f"📤 جاري إرسال الفيديو إلى تلجرام: {video_path}")
              
              # إرسال كملف فيديو مباشر يعرض داخل المحادثة
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendVideo"
              
              payload = {
                  "chat_id": CHAT_ID,
                  "reply_to_message_id": int(MSG_ID) if MSG_ID != "0" else None,
                  "supports_streaming": True
              }
              
              with open(video_path, 'rb') as video_file:
                  files_payload = {'video': video_file}
                  resp = requests.post(url, data=payload, files=files_payload)
              
              if resp.status_code == 200:
                  print("✅ تم إرسال الفيديو بنجاح إلى تلجرام.")
              else:
                  raise Exception(f"فشل إرسال الفيديو لتلجرام: {resp.text}")

          except Exception as e:
              err_msg = str(e)
              print(f"❌ خطأ: {err_msg}")
              # إرسال رسالة خطأ نصية في حال فشل رفع الفيديو
              error_url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              error_data = {
                  "chat_id": CHAT_ID, 
                  "text": f"❌ **فشل إرسال الفيديو**\n⚠️ السبب: {err_msg}", 
                  "parse_mode": "Markdown",
                  "reply_to_message_id": int(MSG_ID) if MSG_ID != "0" else None
              }
              requests.post(error_url, json=error_data)
              sys.exit(1)
          PYTHON_SCRIPT
        env:
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          MSG_ID: ${{ github.event.inputs.message_id }}
