name: Instagram to Buffer (Private Repo Fix)

on:
  workflow_dispatch:
    inputs:
      instagram_url:
        description: 'رابط انستغرام'
        required: true
        type: string
      chat_id:
        description: 'Chat ID'
        required: true
        type: string
      message_id:
        description: 'Message ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deps
        run: pip install instaloader requests

      - name: Download from Instagram
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import sys
          import instaloader
          import glob

          INSTAGRAM_URL = os.getenv('INSTAGRAM_URL')

          try:
              shortcode = None
              if "/reel/" in INSTAGRAM_URL:
                  shortcode = INSTAGRAM_URL.split("/reel/")[1].split("/")[0]
              elif "/p/" in INSTAGRAM_URL:
                  shortcode = INSTAGRAM_URL.split("/p/")[1].split("/")[0]
              
              if not shortcode:
                  raise Exception("رابط غير صالح")

              print(f"🔍 جاري جلب: {shortcode}")

              os.makedirs("./videos", exist_ok=True)
              L = instaloader.Instaloader(download_pictures=False, download_videos=True, download_video_thumbnails=False, download_comments=False, save_metadata=False, dirname_pattern="./videos", filename_pattern="{shortcode}")
              post = instaloader.Post.from_shortcode(L.context, shortcode)
              
              if not post.is_video:
                  raise Exception("المنشور ليس فيديو")

              L.download_post(post, target="./videos")
              
              files = [f for f in glob.glob("./videos/*") if f.endswith('.mp4')]
              if not files: raise Exception("فشل التحميل إلى مجلد videos")
              
              print(f"✅ تم الحفظ في المجلد المحلي: {files[0]}")

          except Exception as e:
              print(f"❌ خطأ: {str(e)}")
              sys.exit(1)
          PYTHON_SCRIPT
        env:
          INSTAGRAM_URL: ${{ github.event.inputs.instagram_url }}

      - name: Commit and Push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/*.mp4
          git commit -m "Save video to repository [skip ci]" || echo "No changes to commit"
          git push

      - name: Send Private Link with Token to Buffer
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import sys
          import glob
          import requests
          import urllib.parse
          import time

          CHAT_ID = os.getenv('CHAT_ID')
          MSG_ID = os.getenv('MSG_ID')
          BOT_TOKEN = "8769565075:AAEOC6vXy7XgXJ-G5kn5V5PxPTC4EWlBfo8"
          BUFFER_TOKEN = "MnPkbBRZulID113ZBbcU1FaOSRRKckgvUJAKT3uqMfg"
          BUFFER_CHANNEL_ID = "6a11e7f5090476fb99512e90"
          GITHUB_TOKEN = os.getenv('GITHUB_TOKEN')
          GITHUB_REPOSITORY = os.getenv('GITHUB_REPOSITORY')

          def send_telegram(text):
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              data = {"chat_id": CHAT_ID, "text": text, "parse_mode": "Markdown", "reply_to_message_id": int(MSG_ID) if MSG_ID != "0" else None}
              if MSG_ID != "0":
                  requests.post(url, json=data)

          try:
              files = [f for f in glob.glob("./videos/*") if f.endswith('.mp4')]
              if not files: raise Exception("لم يتم العثور على ملف الفيديو")
              
              filename = os.path.basename(files[0])
              encoded_filename = urllib.parse.quote(filename)
              
              # توليد رابط يتضمن توكن جيت هاب للسماح لـ Buffer بالتحميل من المستودع الخاص
              public_url = f"https://x-token-auth:{GITHUB_TOKEN}@raw.githubusercontent.com/{GITHUB_REPOSITORY}/refs/heads/main/videos/{encoded_filename}"
              print("✅ تم توليد رابط الوصول الآمن للمستودع الخاص.")
              
              print("⏳ جاري الانتظار لمدة 20 ثانية...")
              time.sleep(20)

              caption = f"Video: {filename.split('.')[0]}"
              
              print("🚀 جاري النشر على Buffer...")
              query = f'mutation CreatePost {{ createPost(input: {{ text: "{caption}", channelId: "{BUFFER_CHANNEL_ID}", schedulingType: automatic, mode: addToQueue, assets: {{ video: {{ url: "{public_url}" }} }} }}) {{ ... on PostActionSuccess {{ post {{ id text }} }} ... on MutationError {{ message }} }} }}'
              
              buf_resp = requests.post(
                  "https://api.buffer.com/v1/graphql",
                  json={"query": query},
                  headers={
                      "Authorization": f"Bearer {BUFFER_TOKEN}",
                      "Content-Type": "application/json"
                  }
              )
              
              buf_data = buf_resp.json()
              if buf_resp.status_code == 200 and "data" in buf_data:
                  create_post_data = buf_data["data"]["createPost"]
                  if create_post_data and "post" in create_post_data and create_post_data["post"]:
                      post_id = create_post_data["post"]["id"]
                      send_telegram(f"✅ **تم بنجاح!**\n🎥 تم نشر الفيديو على Buffer من مستودعك الخاص.\n🆔 ID: `{post_id}`")
                      print("✅ تم النشر بنجاح!")
                  elif create_post_data and "message" in create_post_data:
                      raise Exception(f"خطأ Buffer: {create_post_data['message']}")
                  else:
                      raise Exception(f"فشل مجهول في استجابة Buffer: {buf_data}")
              else:
                  raise Exception(f"HTTP Error: {buf_resp.status_code}\nResponse: {buf_resp.text}")

          except Exception as e:
              err_msg = str(e)
              print(f"❌ خطأ: {err_msg}")
              send_telegram(f"❌ **فشل التنفيذ**\n⚠️ السبب: {err_msg}")
              sys.exit(1)
          PYTHON_SCRIPT
        env:
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          MSG_ID: ${{ github.event.inputs.message_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
