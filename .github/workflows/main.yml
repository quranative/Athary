name: Scheduled Bulk Instagram to Buffer (Algeria Time)

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process_reels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install --upgrade requests instaloader

      - name: Process up to 10 Reels Sequentially From File
        id: process_step
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import sys
          import requests
          import urllib.parse
          import time

          TXT_FILE = "reels.txt"
          BUFFER_TOKEN = "MnPkbBRZulID113ZBbcU1FaOSRRKckgvUJAKT3uqMfg"
          BUFFER_CHANNEL_ID = "6a11e7f5090476fb99512e90"
          
          IG_SESSIONID = os.getenv('IG_SESSIONID')

          if not os.path.exists(TXT_FILE) or os.stat(TXT_FILE).st_size == 0:
              sys.exit(0)

          with open(TXT_FILE, "r", encoding="utf-8") as f:
              all_links = [line.strip() for line in f.readlines() if line.strip()]

          if not all_links:
              sys.exit(0)

          total_to_process = min(10, len(all_links))
          successful_count = 0

          for i in range(total_to_process):
              with open(TXT_FILE, "r", encoding="utf-8") as f:
                  current_lines = [line.strip() for line in f.readlines() if line.strip()]
              
              if not current_lines:
                  break
                  
              url = current_lines[0]
              
              try:
                  shortcode = url.split("/reel/")[1].split("/")[0] if "/reel/" in url else url.split("/p/")[1].split("/")[0]
                  
                  api_url = f"https://www.instagram.com/p/{shortcode}/?__a=1&__d=dis"
                  headers = {
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                      "Cookie": f"sessionid={IG_SESSIONID}" if IG_SESSIONID else ""
                  }
                  
                  response = requests.get(api_url, headers=headers)
                  if response.status_code != 200:
                      raise Exception("Failed to fetch Instagram API")
                      
                  data = response.json()
                  if "items" not in data or not data["items"]:
                      raise Exception("No items found in response")
                      
                  item = data["items"][0]
                  if "video_versions" not in item or not item["video_versions"]:
                      raise Exception("No video versions available")
                      
                  direct_video_url = item["video_versions"][0]["url"]
                  
                  caption = item.get("caption", {}).get("text", "Video")
                  clean_caption = caption.replace('"', '\\"').replace('\n', ' ')

                  query = f'mutation CreatePost {{ createPost(input: {{ text: "{clean_caption}", channelId: "{BUFFER_CHANNEL_ID}", schedulingType: automatic, mode: addToQueue, assets: {{ video: {{ url: "{direct_video_url}" }} }} }}) {{ ... on PostActionSuccess {{ post {{ id }} }} ... on MutationError {{ message }} }} }}'
                  
                  buf_resp = requests.post(
                      "https://api.buffer.com/v1/graphql",
                      json={"query": query},
                      headers={"Authorization": f"Bearer {BUFFER_TOKEN}", "Content-Type": "application/json"}
                  )
                  
                  buf_data = buf_resp.json()
                  if buf_resp.status_code == 200 and "data" in buf_data:
                      create_post_data = buf_data["data"]["createPost"]
                      if create_post_data and "post" in create_post_data and create_post_data["post"]:
                          successful_count += 1
                          
                          remaining_lines = current_lines[1:]
                          with open(TXT_FILE, "w", encoding="utf-8") as f:
                              for line in remaining_lines:
                                  f.write(line + "\n")
                                  
                          os.system('git config --global user.name "github-actions[bot]"')
                          os.system('git config --global user.email "github-actions[bot]@users.noreply.github.com"')
                          os.system(f'git add {TXT_FILE}')
                          os.system(f'git commit -m "Remove processed link: {shortcode} [skip ci]" || true')
                          os.system('git push')
                      else:
                          raise Exception("Buffer error")
                  else:
                      raise Exception("HTTP Error")

              except Exception as e:
                  print(f"General error: {e}")
                  remaining_lines = current_lines[1:]
                  with open(TXT_FILE, "w", encoding="utf-8") as f:
                      for line in remaining_lines:
                          f.write(line + "\n")
                  os.system('git config --global user.name "github-actions[bot]"')
                  os.system('git config --global user.email "github-actions[bot]@users.noreply.github.com"')
                  os.system(f'git add {TXT_FILE}')
                  os.system('git commit -m "Skip unresolvable link [skip ci]" || true')
                  os.system('git push')
                  continue

          PYTHON_SCRIPT
        env:
          IG_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
